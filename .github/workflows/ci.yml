name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# slangc compiles the shaders the samples and the shader-dependent test cases
# need. Without it those cases are compiled out and the suite silently drops the
# reflection, pipeline layout and pipeline coverage. The Linux jobs install it
# from the official Slang release (bump SLANG_VERSION to move on); the Windows
# job expects it in the Vulkan SDK installer. MESA_VERSION pins the mesa-dist-win
# build that provides lavapipe on the GPU-less Windows runners, and
# VULKAN_SDK_VERSION pins the Windows installer.
env:
  SLANG_VERSION: "2026.18"
  MESA_VERSION: "26.2.0"
  VULKAN_SDK_VERSION: "1.4.357.0"

jobs:
  # ubuntu-24.04 on purpose, not ubuntu-latest: the LunarG apt repository is
  # pinned to the noble codename, and ubuntu-latest migrates to Ubuntu 26 in
  # October 2026. Revisit when LunarG ships a repo for the newer release.
  test:
    name: build and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # The vk-bootstrap submodule needs current (1.4-era) Vulkan headers, and
      # noble's libvulkan-dev ships 1.3-era ones, so the loader, headers,
      # validation layers and tools come from LunarG's repository instead of
      # the distro packages. mesa-vulkan-drivers stays from the distro: it
      # provides lavapipe, which LunarG does not package.
      - name: Install the Vulkan SDK and lavapipe
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc > /dev/null
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-noble.list https://packages.lunarg.com/vulkan/lunarg-vulkan-noble.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            vulkan-sdk mesa-vulkan-drivers

      # The hosted runners have no GPU, and the suite fails rather than skips
      # when no device can be created, so the software rasterizer has to be
      # present and has to be the one that gets picked. mesa 25.2 renamed the
      # lavapipe manifest from lvp_icd.x86_64.json to lvp_icd.json, so the glob
      # must match both spellings; on failure the icd.d listing shows whatever
      # the next rename produces.
      - name: Point the loader at lavapipe
        run: |
          icd="$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -n1)"
          if [ -z "$icd" ]; then
            echo "no lavapipe ICD; mesa-vulkan-drivers did not install one" >&2
            ls -la /usr/share/vulkan/icd.d/ >&2 || true
            exit 1
          fi
          {
            echo "VK_ICD_FILENAMES=$icd"
            echo "VK_DRIVER_FILES=$icd"
          } >> "$GITHUB_ENV"
          echo "using $icd"

      - name: Cache slangc
        uses: actions/cache@v5
        with:
          path: ~/slang
          key: slang-${{ env.SLANG_VERSION }}-linux-x86_64

      - name: Install slangc
        run: |
          url="https://github.com/shader-slang/slang/releases/download/v${SLANG_VERSION}/slang-${SLANG_VERSION}-linux-x86_64.tar.gz"
          # Look for slangc instead of a fixed path: the tarball's top level
          # directory name is not part of the interface, and hardcoding it would
          # silently turn every cache hit into a fresh download.
          slangc="$(find "$HOME/slang" -type f -name slangc -print -quit 2>/dev/null || true)"
          if [ -z "$slangc" ]; then
            mkdir -p "$HOME/slang"
            curl -fsSL --retry 3 -o slang.tar.gz "$url"
            tar -xzf slang.tar.gz -C "$HOME/slang"
            slangc="$(find "$HOME/slang" -type f -name slangc -print -quit)"
          fi
          if [ -z "$slangc" ]; then
            echo "slangc missing after extracting $url" >&2
            exit 1
          fi
          chmod +x "$slangc"
          echo "$(dirname "$slangc")" >> "$GITHUB_PATH"
          # 2026.18 dropped --version; -h still exercises the binary.
          "$slangc" --version 2>/dev/null || "$slangc" -h >/dev/null 2>&1 || true

      - name: Report the device the tests will use
        run: |
          echo "VK_ICD_FILENAMES=$VK_ICD_FILENAMES"
          vulkaninfo --summary || true

      # Debug on purpose: ContextInfo::validation defaults to true only when
      # NDEBUG is undefined, and several cases rely on that default.
      # Samples off on purpose: this job must stay independent of GLFW and a
      # display, and it is also the configuration a consumer of the installed
      # package uses.
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DVULCAO_BUILD_SAMPLES=OFF

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  samples:
    name: build the samples and run the headless ones
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install the Vulkan SDK, lavapipe and the windowing dependencies
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc > /dev/null
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-noble.list https://packages.lunarg.com/vulkan/lunarg-vulkan-noble.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            vulkan-sdk mesa-vulkan-drivers \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev libwayland-dev libxkbcommon-dev

      - name: Point the loader at lavapipe
        run: |
          icd="$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -n1)"
          if [ -z "$icd" ]; then
            echo "no lavapipe ICD; mesa-vulkan-drivers did not install one" >&2
            ls -la /usr/share/vulkan/icd.d/ >&2 || true
            exit 1
          fi
          {
            echo "VK_ICD_FILENAMES=$icd"
            echo "VK_DRIVER_FILES=$icd"
          } >> "$GITHUB_ENV"
          echo "using $icd"

      - name: Cache slangc
        uses: actions/cache@v5
        with:
          path: ~/slang
          key: slang-${{ env.SLANG_VERSION }}-linux-x86_64

      - name: Install slangc
        run: |
          url="https://github.com/shader-slang/slang/releases/download/v${SLANG_VERSION}/slang-${SLANG_VERSION}-linux-x86_64.tar.gz"
          slangc="$(find "$HOME/slang" -type f -name slangc -print -quit 2>/dev/null || true)"
          if [ -z "$slangc" ]; then
            mkdir -p "$HOME/slang"
            curl -fsSL --retry 3 -o slang.tar.gz "$url"
            tar -xzf slang.tar.gz -C "$HOME/slang"
            slangc="$(find "$HOME/slang" -type f -name slangc -print -quit)"
          fi
          if [ -z "$slangc" ]; then
            echo "slangc missing after extracting $url" >&2
            exit 1
          fi
          chmod +x "$slangc"
          echo "$(dirname "$slangc")" >> "$GITHUB_PATH"
          # 2026.18 dropped --version; -h still exercises the binary.
          "$slangc" --version 2>/dev/null || "$slangc" -h >/dev/null 2>&1 || true

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DVULCAO_BUILD_SAMPLES=ON

      - name: Build
        run: cmake --build build

      # 03_compute and 04_offscreen need no display and return non-zero on a
      # wrong result or on a validation error, so they are real tests rather
      # than demos. The four windowed samples are only compiled here.
      - name: Run the headless samples
        run: |
          ./build/samples/03_compute/compute
          ./build/samples/04_offscreen/offscreen

  # One combined job instead of the test/samples split: Windows runners bill
  # at 2x, so it builds the library, the samples and the tests in one pass,
  # runs ctest and executes the two headless samples.
  windows:
    name: build and test on windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # The official installer is the only package that carries the headers,
      # the import libraries, the validation layers and the tools together.
      # The zip the setup-vulkan-sdk action unpacks is Bin-only - no Include,
      # no Lib - which FindVulkan rejects. The installer is over a gigabyte,
      # so it is cached by version.
      - name: Cache the Vulkan SDK installer
        uses: actions/cache@v5
        with:
          path: vulkan-sdk.exe
          key: vulkan-sdk-installer-${{ env.VULKAN_SDK_VERSION }}-windows

      - name: Install the Vulkan SDK
        shell: bash
        run: |
          if [ ! -f vulkan-sdk.exe ]; then
            curl -fsSL --retry 3 -o vulkan-sdk.exe \
              "https://sdk.lunarg.com/sdk/download/${VULKAN_SDK_VERSION}/windows/vulkan-sdk.exe"
          fi
          # Qt Installer Framework CLI mode: the trailing install command is
          # what switches the installer out of GUI mode - without it every
          # option is merely warned about and ignored. --default-answer takes
          # the defaults, --confirm-command skips the final y/n prompt.
          ./vulkan-sdk.exe --root "$PWD/VULKAN_SDK" --accept-licenses \
            --default-answer --confirm-command install
          lib="$(find "$PWD/VULKAN_SDK" -name vulkan-1.lib -print -quit)"
          if [ -z "$lib" ]; then
            echo "installer produced no vulkan-1.lib under $PWD/VULKAN_SDK" >&2
            find "$PWD/VULKAN_SDK" -maxdepth 3 >&2 || true
            exit 1
          fi
          # The SDK root is where vulkan-1.lib's Lib/ and its sibling Include/
          # and Bin/ live, wherever the installer nested them.
          sdk="$(cd "$(dirname "$(dirname "$lib")")" && pwd -W)"
          echo "VULKAN_SDK=$(cygpath -m "$sdk")" >> "$GITHUB_ENV"
          echo "$(cygpath -m "$sdk/Bin")" >> "$GITHUB_PATH"
          echo "sdk at $sdk"

      # The SDK ships slangc; fall back to the Slang release if a future
      # installer drops it. PATH exports apply from the next step on.
      - name: Ensure slangc
        shell: bash
        run: |
          if ! command -v slangc > /dev/null 2>&1; then
            echo "slangc not in the SDK; falling back to the Slang release" >&2
            curl -fsSL --retry 3 -o slang.zip \
              "https://github.com/shader-slang/slang/releases/download/v${SLANG_VERSION}/slang-${SLANG_VERSION}-windows-x86_64.zip"
            tar -xf slang.zip -C "$HOME/slang"
            slangc="$(find "$HOME/slang" -name slangc.exe -print -quit)"
            echo "$(cygpath -m "$(dirname "$slangc")")" >> "$GITHUB_PATH"
          fi

      # The runners have no GPU and the SDK zip carries neither SwiftShader nor
      # registry entries, so the device comes from mesa-dist-win's lavapipe
      # (the same CPU driver the Linux jobs use) and the loader finds it and
      # the unpacked validation layers through the explicit env vars. Both are
      # located by search rather than fixed paths so layout changes between
      # releases fail loudly with a listing instead of a confusing "no device"
      # error three steps later.
      - name: Point the loader at lavapipe and the layers at the SDK
        shell: bash
        run: |
          set -e
          curl -fsSL --retry 3 -o mesa.7z \
            "https://github.com/pal1000/mesa-dist-win/releases/download/${MESA_VERSION}/mesa3d-${MESA_VERSION}-release-msvc.7z"
          7z x -y -omesa mesa.7z > /dev/null
          icd="$(find mesa -name 'lvp_icd*.json' -path '*x64*' -print 2>/dev/null | head -n1)"
          if [ -z "$icd" ] || [ ! -f "$(dirname "$icd")/vulkan_lvp.dll" ]; then
            echo "no x64 lavapipe ICD next to vulkan_lvp.dll in the mesa package" >&2
            find mesa -name '*lvp*' >&2 || true
            exit 1
          fi
          sdk="$(cygpath -u "$VULKAN_SDK")"
          layers="$(find "$sdk" -name 'VkLayer_khronos_validation.json' -print 2>/dev/null | head -n1)"
          if [ -z "$layers" ]; then
            echo "no validation layer manifest under $VULKAN_SDK" >&2
            find "$sdk" -maxdepth 2 >&2 || true
            exit 1
          fi
          {
            # The ICD references vulkan_lvp.dll relatively, which the loader
            # resolves next to the manifest.
            echo "VK_DRIVER_FILES=$(cygpath -m "$PWD/$icd")"
            echo "VK_ICD_FILENAMES=$(cygpath -m "$PWD/$icd")"
            echo "VK_LAYER_PATH=$(cygpath -m "$(dirname "$layers")")"
          } >> "$GITHUB_ENV"
          echo "using icd: $icd"
          echo "using layers: $layers"

      - name: Report the device the tests will use
        shell: bash
        run: |
          echo "VK_DRIVER_FILES=$VK_DRIVER_FILES"
          vulkaninfo --summary || true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      # Debug on purpose, same as the Linux jobs.
      - name: Configure and build
        shell: bash
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DVULCAO_BUILD_SAMPLES=ON
          cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Run the headless samples
        shell: bash
        run: |
          ./build/samples/03_compute/compute.exe
          ./build/samples/04_offscreen/offscreen.exe
